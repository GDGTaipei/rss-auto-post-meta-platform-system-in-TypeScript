# This workflow is used to deploy the Firebase Functions to Firebase.
# It is triggered when a push is made to the main branch.
# It uses the Google GitHub Actions to authenticate with Firebase.
# It then uses the Firebase Tools to deploy the functions.
# Ref: https://firebase.google.com/docs/functions/deploy-github-ci  

name: Deploy to Firebase Functions

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v3
      with:
        node-version: '22.x'

    - name: Create .env file
      env:
        SOCIAL_MEDIA_POST_API_URL: ${{ secrets.SOCIAL_MEDIA_POST_API_URL }}
        FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PLATFORM_ACCESS_TOKEN }}
        INSTAGRAM_PAGE_ID: ${{ secrets.INSTAGRAM_PAGE_ID }}
        INSTAGRAM_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PLATFORM_ACCESS_TOKEN }}
        THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_PRODUCTION }}
      run: |
        echo "SOCIAL_MEDIA_POST_API_URL=${{ env.SOCIAL_MEDIA_POST_API_URL }}" >> .env
        echo "FACEBOOK_PAGE_ID=${{ env.FACEBOOK_PAGE_ID }}" >> .env
        echo "FACEBOOK_PAGE_ACCESS_TOKEN=${{ env.FACEBOOK_PAGE_ACCESS_TOKEN }}" >> .env
        echo "INSTAGRAM_PAGE_ID=${{ env.INSTAGRAM_PAGE_ID }}" >> .env
        echo "INSTAGRAM_PAGE_ACCESS_TOKEN=${{ env.INSTAGRAM_PAGE_ACCESS_TOKEN }}" >> .env
        echo "THREADS_USER_ID=${{ env.THREADS_USER_ID }}" >> .env
        echo "CONFIG_JSON=${{ env.CONFIG_JSON }}" >> .env
        cat .env

    - name: Install dependencies
      run: npm ci

    - name: Run lint
      run: npm run lint

    - name: Run tests
      run: npm test

    - name: Build project
      run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v3
      with:
        node-version: 20.x
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build project
      run: npm run build
      
    - name: Deploy to Firebase Functions
      uses: FirebaseExtended/action-hosting-deploy@v0
      with:
        repoToken: '${{ secrets.GITHUB_TOKEN }}'
        firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
        projectId: '${{ secrets.FIREBASE_PROJECT_ID }}'
        channelId: live 