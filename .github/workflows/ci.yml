name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}

    - name: Create .env file
      env:
        SOCIAL_MEDIA_POST_API_URL: ${{ secrets.SOCIAL_MEDIA_POST_API_URL }}
        FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        INSTAGRAM_PAGE_ID: ${{ secrets.INSTAGRAM_PAGE_ID }}
        INSTAGRAM_PAGE_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_PAGE_ACCESS_TOKEN }}
        THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        THREADS_CLIENT_SECRET: ${{ secrets.THREADS_CLIENT_SECRET }}
        THREADS_SHORT_LIVED_TOKEN: ${{ secrets.THREADS_SHORT_LIVED_TOKEN }}
        THREADS_PAGE_ACCESS_TOKEN: ${{ secrets.THREADS_PAGE_ACCESS_TOKEN }}
      run: |
        echo "SOCIAL_MEDIA_POST_API_URL=${SOCIAL_MEDIA_POST_API_URL:-http://localhost:5001/rss-auto-post-meta-platform/us-central1/index}" >> .env
        echo "FACEBOOK_PAGE_ID=${FACEBOOK_PAGE_ID:-dummy_facebook_page_id}" >> .env
        echo "FACEBOOK_PAGE_ACCESS_TOKEN=${FACEBOOK_PAGE_ACCESS_TOKEN:-dummy_facebook_token}" >> .env
        echo "INSTAGRAM_PAGE_ID=${INSTAGRAM_PAGE_ID:-dummy_instagram_page_id}" >> .env
        echo "INSTAGRAM_PAGE_ACCESS_TOKEN=${INSTAGRAM_PAGE_ACCESS_TOKEN:-dummy_instagram_token}" >> .env
        echo "THREADS_USER_ID=${THREADS_USER_ID:-dummy_threads_user_id}" >> .env
        echo "THREADS_CLIENT_SECRET=${THREADS_CLIENT_SECRET:-dummy_threads_client_secret}" >> .env
        echo "THREADS_SHORT_LIVED_TOKEN=${THREADS_SHORT_LIVED_TOKEN:-dummy_threads_short_lived_token}" >> .env
        echo "THREADS_PAGE_ACCESS_TOKEN=${THREADS_PAGE_ACCESS_TOKEN:-dummy_threads_access_token}" >> .env
        cat .env

    - name: Install dependencies
      run: npm ci

    - name: Run lint
      run: npm run lint

    - name: Run tests
      run: npm test

    - name: Build project
      run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v3
      with:
        node-version: 20.x
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build project
      run: npm run build
      
    - name: Deploy to Firebase Functions
      uses: FirebaseExtended/action-hosting-deploy@v0
      with:
        repoToken: '${{ secrets.GITHUB_TOKEN }}'
        firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
        projectId: '${{ secrets.FIREBASE_PROJECT_ID }}'
        channelId: live 